name: Daily Job Finder Sweep

on:
  schedule:
    # Runs 3x daily at off-peak minutes: 9:05 AM PDT (16:05 UTC), 12:05 PM PDT (19:05 UTC), 4:05 PM PDT (23:05 UTC)
    - cron: '5 16,19,23 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Daily ATS Job Sweep
        run: |
          python update_jobs.py

      - name: Commit and Push Updated Jobs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "chore(auto): daily automated ATS job sweep [skip ci]"
            git push origin main
          fi
