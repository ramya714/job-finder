name: Daily Job Finder Sweep

on:
  schedule:
    # Runs every day at 16:00 UTC (9:00 AM PDT / 12:00 PM EDT)
    - cron: '0 16 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Daily ATS Job Sweep
        run: |
          python update_jobs.py

      - name: Commit and Push Updated Jobs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "chore(auto): daily automated ATS job sweep [skip ci]"
            git push origin main
          fi
